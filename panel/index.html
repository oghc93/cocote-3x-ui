<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Cocote Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5fa;--card:#fff;--card2:#f8f9fd;--ink:#0f172a;--soft:#475569;--mut:#94a3b8;--bd:#e2e8f0;--a:#4f46e5;--a2:#7c3aed;--aink:#fff;--ok:#15803d;--okb:#dcfce7;--warn:#a16207;--warnb:#fef3c7;--bad:#b91c1c;--badb:#fee2e2;--info:#1d4ed8;--infob:#dbeafe;--side:#fff;--sh:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05);--r:14px}
[data-theme=dark]{--bg:#0b1020;--card:#131a2e;--card2:#182139;--ink:#e8edfb;--soft:#a5b1d0;--mut:#6b7899;--bd:#243050;--a:#818cf8;--a2:#a78bfa;--aink:#0b1020;--ok:#4ade80;--okb:rgba(74,222,128,.14);--warn:#fcd34d;--warnb:rgba(252,211,77,.13);--bad:#fb7185;--badb:rgba(251,113,133,.14);--info:#93c5fd;--infob:rgba(147,197,253,.14);--side:#0e1428;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25)}
[data-theme=aurora]{--bg:#070b1a;--card:rgba(255,255,255,.07);--card2:rgba(255,255,255,.05);--ink:#eaf0ff;--soft:#b3c0e3;--mut:#7e8db4;--bd:rgba(255,255,255,.14);--a:#5eead4;--a2:#a78bfa;--aink:#06122b;--ok:#86efac;--okb:rgba(74,222,128,.14);--warn:#fcd34d;--warnb:rgba(252,211,77,.12);--bad:#fda4af;--badb:rgba(251,113,133,.14);--info:#93c5fd;--infob:rgba(147,197,253,.14);--side:rgba(10,15,35,.7);--sh:none}
[data-theme=glass]{--bg:#dbe4fb;--card:rgba(255,255,255,.55);--card2:rgba(255,255,255,.42);--ink:#0f172a;--soft:#334155;--mut:#64748b;--bd:rgba(71,85,105,.2);--a:#4f46e5;--a2:#db2777;--aink:#fff;--ok:#15803d;--okb:rgba(34,197,94,.2);--warn:#a16207;--warnb:rgba(250,204,21,.28);--bad:#b91c1c;--badb:rgba(239,68,68,.18);--info:#1d4ed8;--infob:rgba(59,130,246,.2);--side:rgba(255,255,255,.5);--sh:0 8px 32px rgba(49,46,129,.14)}
[data-theme=glass] body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;background:radial-gradient(38% 32% at 12% 8%,rgba(99,102,241,.55),transparent 70%),radial-gradient(36% 30% at 88% 12%,rgba(236,72,153,.42),transparent 70%),radial-gradient(44% 34% at 50% 100%,rgba(45,212,191,.45),transparent 70%),radial-gradient(30% 26% at 90% 80%,rgba(251,191,36,.35),transparent 70%)}
[data-theme=glass] .card,[data-theme=glass] .side,[data-theme=glass] .top,[data-theme=glass] .bnav{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
[data-theme=glass] .card,[data-theme=glass] .tw,[data-theme=glass] .side,[data-theme=glass] .bnav{border-color:rgba(255,255,255,.8)}
[data-theme=glass] .card,[data-theme=glass] .tw{box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.8)}
[data-theme=glass] .btn,[data-theme=glass] input,[data-theme=glass] select,[data-theme=glass] .chip{border-color:rgba(255,255,255,.85)}
[data-theme=glass] .btn.p{border-color:transparent}
[data-theme=glass] .chip.on{border-color:var(--a)}
[data-theme=glass] .modal{background:#fff}
[data-theme=glass] .top{background:rgba(255,255,255,.4)}
[data-theme=glass] tbody tr:hover td{background:rgba(255,255,255,.45)}
[data-theme=aurorag]{--bg:#060914;--card:rgba(255,255,255,.075);--card2:rgba(255,255,255,.06);--ink:#f1f5ff;--soft:#c3cdeb;--mut:#8896bf;--bd:rgba(255,255,255,.17);--a:#67e8f9;--a2:#c084fc;--aink:#06122b;--ok:#86efac;--okb:rgba(74,222,128,.15);--warn:#fcd34d;--warnb:rgba(252,211,77,.14);--bad:#fda4af;--badb:rgba(251,113,133,.16);--info:#93c5fd;--infob:rgba(147,197,253,.16);--side:rgba(10,14,36,.55);--sh:0 12px 40px rgba(0,0,0,.35)}
[data-theme=aurorag] body::before{content:"";position:fixed;inset:-15%;z-index:-1;pointer-events:none;background:radial-gradient(34% 30% at 14% 10%,rgba(45,212,191,.55),transparent 70%),radial-gradient(34% 30% at 86% 8%,rgba(139,92,246,.6),transparent 70%),radial-gradient(30% 28% at 78% 62%,rgba(236,72,153,.32),transparent 70%),radial-gradient(40% 30% at 30% 100%,rgba(56,189,248,.42),transparent 70%)}
[data-theme=aurorag] .card,[data-theme=aurorag] .side,[data-theme=aurorag] .top,[data-theme=aurorag] .bnav{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
[data-theme=aurorag] .card,[data-theme=aurorag] .tw{background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border-color:rgba(255,255,255,.2);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 1px rgba(255,255,255,.03)}
[data-theme=aurorag] .btn,[data-theme=aurorag] input,[data-theme=aurorag] select,[data-theme=aurorag] textarea,[data-theme=aurorag] .chip{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.2)}
[data-theme=aurorag] .btn.p{background:linear-gradient(135deg,#5eead4,#a78bfa 60%,#f0abfc);border-color:transparent;box-shadow:0 6px 22px rgba(167,139,250,.35)}
[data-theme=aurorag] .chip.on{background:linear-gradient(135deg,#5eead4,#a78bfa);color:#06122b;border-color:transparent}
[data-theme=aurorag] .nav.on{box-shadow:inset 0 0 0 1px rgba(103,232,249,.35)}
[data-theme=aurorag] .logo i{box-shadow:0 0 22px rgba(103,232,249,.5)}
[data-theme=aurorag] .modal{background:rgba(13,18,44,.92);border-color:rgba(255,255,255,.2)}
[data-theme=aurorag] .top{background:rgba(8,12,30,.45)}
[data-theme=aurorag] tbody tr:hover td{background:rgba(255,255,255,.05)}
[data-theme=aurorag] .bar i{background:linear-gradient(90deg,#5eead4,#a78bfa,#f0abfc)}
[data-theme=aurorag] .bulk{background:rgba(241,245,255,.95)}
html[data-perf=lite] *,html[data-perf=lite] *::before{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;animation:none!important;transition:none!important}
html[data-perf=lite] .card,html[data-perf=lite] .tw{box-shadow:none!important}
html[data-perf=lite][data-theme=aurorag] .card,html[data-perf=lite][data-theme=aurorag] .tw{background:rgba(24,30,64,.92)}
html[data-perf=lite][data-theme=aurora] .card{background:rgba(24,30,64,.92)}
html[data-perf=lite][data-theme=glass] .card,html[data-perf=lite][data-theme=glass] .tw{background:rgba(255,255,255,.88)}
html[data-perf=lite][data-theme=glass] .side,html[data-perf=lite][data-theme=glass] .bnav{background:rgba(255,255,255,.95)}
html[data-perf=lite][data-theme=aurora] .side,html[data-perf=lite][data-theme=aurora] .bnav,html[data-perf=lite][data-theme=aurorag] .side,html[data-perf=lite][data-theme=aurorag] .bnav{background:#0c1130}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%;min-height:100vh}
[data-theme=aurora] body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;background:radial-gradient(40% 30% at 15% 5%,rgba(20,184,166,.4),transparent 70%),radial-gradient(40% 30% at 85% 5%,rgba(124,58,237,.42),transparent 70%),radial-gradient(50% 30% at 55% 100%,rgba(37,99,235,.25),transparent 70%)}
[data-theme=aurora] .card,[data-theme=aurora] .side,[data-theme=aurora] .top,[data-theme=aurora] .bnav{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
.mono{font-family:'JetBrains Mono',monospace;font-size:12.5px}
.muted{color:var(--soft)}.faint{color:var(--mut)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* layout */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--bd);padding:16px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;padding:4px 8px 14px}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--a),var(--a2));display:grid;place-items:center;color:var(--aink)}
.nav{display:flex;align-items:center;gap:12px;min-height:42px;padding:0 12px;border-radius:10px;border:0;background:none;color:var(--soft);font-weight:600;font-size:14px;width:100%;text-align:left}
.nav:hover{background:var(--card2);color:var(--ink)}
.nav.on{background:linear-gradient(135deg,color-mix(in srgb,var(--a) 16%,transparent),color-mix(in srgb,var(--a2) 14%,transparent));color:var(--a)}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--infob);color:var(--info)}
.side .sp{flex:1}
.main{min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 20px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.top h1{font-size:18px;margin:0;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{padding:20px;max-width:1280px;margin:0 auto}
.bnav{display:none}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--a)}
.btn.p{background:linear-gradient(135deg,var(--a),var(--a2));border-color:transparent;color:var(--aink);font-weight:700}
.btn.d{color:var(--bad)}.btn.d:hover{border-color:var(--bad)}
.btn.s{min-height:32px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn .bt{display:none}
td.ac .btn.s:not([data-a=link]){padding:0 9px}
td.ac{white-space:nowrap}
.btn.ic{width:38px;padding:0}
a.btn{text-decoration:none;color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);outline:none}
textarea{padding:10px 12px;min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 20%,transparent)}
select option{color:#111;background:#fff}
label.l{display:block;font-size:12.5px;font-weight:600;color:var(--soft);margin:12px 0 5px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.card h3{margin:0 0 12px;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;font-weight:500;font-size:12px;color:var(--mut)}
.grid{display:grid;gap:14px}
.g21{align-items:start}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g21{grid-template-columns:2fr 1fr}
.kpi{display:flex;gap:12px;align-items:center}
.kpi .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.kpi .v{font-size:24px;font-weight:800;line-height:1.1}
.kpi .t{font-size:12.5px;color:var(--soft);font-weight:600}
.kpi .n{font-size:12px;color:var(--mut)}
.bar{height:7px;border-radius:9px;background:var(--card2);border:1px solid var(--bd);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--a),var(--a2))}
.bar.w i{background:var(--warn)}.bar.b i{background:var(--bad)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--okb);color:var(--ok)}.b-warn{background:var(--warnb);color:var(--warn)}.b-bad{background:var(--badb);color:var(--bad)}.b-info{background:var(--infob);color:var(--info)}.b-n{background:var(--card2);color:var(--soft);border:1px solid var(--bd)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--mut)}.dot.ok{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2)}.dot.bad{background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tools .grow{flex:1;min-width:160px}
.tools select{width:auto;min-width:120px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--bd);background:var(--card);font-weight:600;font-size:12.5px;color:var(--soft)}
.chip.on{background:var(--a);color:var(--aink);border-color:var(--a)}
/* table */
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:var(--r);background:var(--card)}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);text-align:left;padding:10px 12px;background:var(--card2);border-bottom:1px solid var(--bd);white-space:nowrap;cursor:default;user-select:none}
th.sort{cursor:pointer}th.sort:hover{color:var(--ink)}
td{padding:10px 12px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--card2)}
td.ac{white-space:nowrap;text-align:right}
td input[type=checkbox],th input[type=checkbox]{width:17px;min-height:17px;accent-color:var(--a)}
.empty{padding:34px 16px;text-align:center;color:var(--mut)}
.bulk{position:sticky;bottom:78px;z-index:15;margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:14px;background:var(--ink);color:var(--bg)}
.bulk .btn{background:transparent;color:inherit;border-color:rgba(255,255,255,.3)}
/* overlay */
.ov{position:fixed;inset:0;z-index:60;background:rgba(8,12,28,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--card);background-clip:padding-box;border:1px solid var(--bd);border-radius:18px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
[data-theme=aurora] .modal{background:#0d1530}
.modal h2{margin:0 0 4px;font-size:17px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
pre{white-space:pre-wrap;word-break:break-all;background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:12px;font-size:12px;margin:10px 0 0;max-height:260px;overflow:auto;font-family:'JetBrains Mono',monospace}
.lk{display:flex;gap:8px;align-items:center;margin-top:8px}
.lk code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--card2);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;font-size:12px;font-family:'JetBrains Mono',monospace}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;max-width:92vw;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.toast.err{background:var(--bad);color:#fff}
.srv .h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.srv .h b{font-size:15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--mut)}
.svc{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--bd)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.mini small{display:block;color:var(--mut);font-size:11px;font-weight:600}
.mini b{font-size:12.5px}
.chart{width:100%;height:170px;display:block}
.chart text{fill:var(--mut);font-size:10px}
.sec{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:18px 0 8px}
.login{max-width:380px;margin:14vh auto 0;padding:16px}
.login .card{padding:26px}
.note{font-size:12.5px;color:var(--soft);background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-top:10px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--bd);border-top-color:var(--a);animation:sp .7s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.sk{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--card2),var(--bd),var(--card2));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ---- pro polish ---- */
.upd{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);margin-right:auto;white-space:nowrap}
.upd i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.upd.old i{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 22%,transparent)}
.top h1{margin-right:0}
#bPal{gap:8px;color:var(--mut);font-weight:500}#bPal .pi{display:inline-flex}
#bPal kbd,.pal kbd{font:600 10.5px/1 ui-monospace,monospace;padding:3px 6px;border-radius:6px;border:1px solid var(--bd);color:var(--mut);background:var(--card2)}
#sc{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{transition:transform .18s,border-color .18s}
.grid>.card:hover{border-color:color-mix(in srgb,var(--a) 38%,var(--bd))}
.kpi .v{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tw thead th{position:sticky;top:0;z-index:2;background:var(--card2);backdrop-filter:none}
.tw tbody tr{transition:background .12s}
.tw tbody tr:hover td{background:color-mix(in srgb,var(--a) 6%,transparent)}
.view-in{animation:vin .22s ease both}@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
html[data-perf=lite] .view-in{animation:none}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.pal{width:min(560px,94vw);padding:0;overflow:hidden}
.pal input{width:100%;border:0;border-bottom:1px solid var(--bd);border-radius:0;min-height:54px;padding:0 18px;font-size:15.5px;background:transparent;outline:0}
.pal .pl{max-height:min(52vh,420px);overflow:auto;padding:8px}
.pal .pg{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:10px 10px 4px}
.pal .pr{display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:0 10px;border:0;border-radius:10px;background:none;color:var(--ink);font-size:14px;text-align:left;cursor:pointer}
.pal .pr.on,.pal .pr:hover{background:color-mix(in srgb,var(--a) 14%,transparent)}
.pal .pr small{margin-left:auto;color:var(--mut);font-size:12px}
.pal .pe{padding:26px;text-align:center;color:var(--mut)}
.pal .pf{display:flex;gap:14px;padding:9px 16px;border-top:1px solid var(--bd);font-size:11.5px;color:var(--mut)}
@media(max-width:820px){#bPal .pt,#bPal kbd{display:none}#bPal{padding:0;width:42px;justify-content:center}.upd span{display:none}}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}.g21{grid-template-columns:1fr}}
@media(max-width:820px){
 .btn .bt{display:inline}
 .top h1{font-size:16px;min-width:0}#selSrv{max-width:120px!important}
 #bTrial .tl{display:none}#bTrial{width:38px;padding:0}
 .app{grid-template-columns:1fr}
 .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:70;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.4)}
 .side.open{transform:none}
 .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--side);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
 .bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:50px;border:0;background:none;color:var(--mut);font-size:10.5px;font-weight:700;border-radius:10px}
 .bnav button.on{color:var(--a)}
 .wrap{padding:14px 14px 96px}
 .top{padding:10px 14px}
 .g3,.g2{grid-template-columns:1fr}

 /* tabel jadi kartu */
 table.rs,table.rs tbody,table.rs tr,table.rs td{display:block}

 table.rs tr{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:10px;padding:8px 12px;position:relative}
 table.rs td{border:0;padding:5px 0;display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:right}
 table.rs td[data-l]::before{content:attr(data-l);color:var(--mut);font-size:11.5px;font-weight:600;text-align:left}
 table.rs td.ck{justify-content:flex-start;gap:10px;padding-bottom:6px;border-bottom:1px solid var(--bd);margin-bottom:4px}
 table.rs td.ck::before{content:'Pilih'}

 table.rs tbody tr:hover td{background:none}
}

</div>

<script>
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var IC={
 dash:'<rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/>',

 tool:'<path d="M14.7 6.3a4 4 0 0 0-5 5L3 18l3 3 6.7-6.7a4 4 0 0 0 5-5l-2.5 2.5-2.4-.6-.6-2.4z"/>',
 set:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14.2 3h-4l-.4 2.7a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2l.4 2.7h4l.4-2.7a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/>',
 menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',

 out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
 link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
 cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',
 edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
 del:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
 kick:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
 copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
 dl:'<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>',
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
 bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 x:'<path d="M18 6L6 18M6 6l12 12"/>',
 chk:'<path d="M20 6L9 17l-5-5"/>'
};
var ic=function(n){return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+(IC[n]||'')+'</svg>'};

/* ---------- util ---------- */
var tmr=null;
function toast(m,err){var t=$('#toast');t.textContent=m;t.className='toast'+(err?' err':'');clearTimeout(tmr);tmr=setTimeout(function(){t.className='toast hide'},err?5000:2600)}
var KEYN='vpnpanel-api-key',API='/api/',LOCAL='local';
function apiKey(){try{return localStorage.getItem(KEYN)||''}catch(e){return ''}}
function apiFetch(qs,opt){opt=opt||{};var h={'X-Api-Key':apiKey()},body=opt.body;
 if(body&&typeof body!=='string')body=JSON.stringify(body);if(body)h['Content-Type']='application/json';
 return fetch(API+'?'+qs,{method:opt.method||'GET',body:body,headers:h}).then(function(r){return r.text().then(function(t){var d;try{d=JSON.parse(t)}catch(e){d={ok:false,error:'Respons tidak valid (HTTP '+r.status+')'}}
  if((r.status===401||r.status===403)&&!opt.noLogin){showLogin();throw new Error('API key ditolak, masukkan lagi')}
  if(!r.ok&&d&&!Array.isArray(d)&&d.ok!==false&&!d.error)d={ok:false,error:'HTTP '+r.status};
  return d})})}
function jf(url,opt){opt=opt||{};var NO=function(m){return Promise.resolve({ok:false,error:m||'Tidak tersedia di panel VPS'})};
 if(url==='/auth/me')return apiFetch('action=summary',{noLogin:1}).then(function(d){return {ok:!bad(d)}},function(){return {ok:false}});
 if(url==='/auth/login'){var k=String((opt.body&&opt.body.password)||'').trim();try{localStorage.setItem(KEYN,k)}catch(e){}
  return apiFetch('action=summary',{noLogin:1}).then(function(d){if(bad(d)){try{localStorage.removeItem(KEYN)}catch(e){}return {ok:false,error:'API key salah atau server tidak merespons'}}return {ok:true}},function(e){return {ok:false,error:e.message}})}
 if(url==='/auth/logout'){try{localStorage.removeItem(KEYN)}catch(e){}return Promise.resolve({ok:true})}
 if(url==='/servers'&&!opt.method)return Promise.resolve({servers:[{id:LOCAL,name:location.hostname,base:location.origin+'/api'}]});
 var m=url.match(/^\/s\/local\?([\s\S]*)$/);if(m)return apiFetch(m[1],opt);
 if(/^\/ping\/local/.test(url)){var t0=Date.now();return apiFetch('action=summary',{noLogin:1}).then(function(d){return bad(d)?{ok:false,error:(d&&d.error)||'gagal'}:{ok:true,ms:Date.now()-t0}},function(e){return {ok:false,error:e.message}})}
 if(/^\/tg\//.test(url))return Promise.resolve({ok:true,connected:false,paired:false});
 return NO()}
function vps(id,qs,method,body){return jf('/s/'+id+'?'+qs,{method:method||'GET',body:body})}
function bad(d){return !d||(!Array.isArray(d)&&(d.ok===false||d.error))}
function errMsg(d){return (d&&d.error)||'Gagal'}
function bytes(n){n=Number(n)||0;var u=['B','KB','MB','GB','TB'],i=0;while(n>=1024&&i<4){n/=1024;i++}return (i?n.toFixed(n>=100?0:1):n)+' '+u[i]}
function mb(n){n=Number(n)||0;return n>=1024?(n/1024).toFixed(n>=10240?0:1)+' GB':n+' MB'}
function ago(t){var s=Math.floor(Date.now()/1000-t);if(s<60)return s+' dtk lalu';if(s<3600)return Math.floor(s/60)+' mnt lalu';if(s<86400)return Math.floor(s/3600)+' jam lalu';return Math.floor(s/86400)+' hari lalu'}
function copy(t){var ok=function(){toast('Disalin')};
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(ok,function(){fb()});else fb();
 function fb(){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast('Gagal menyalin',1)}a.remove()}}
function save(name,text,type){var b=new Blob([text],{type:type||'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
function modal(html,wide){var o=document.createElement('div');o.className='ov';o.innerHTML='<div class="modal" role="dialog" aria-modal="true" style="'+(wide?'max-width:680px':'')+'">'+html+'</div>';
 o.addEventListener('mousedown',function(e){if(e.target===o)close()});
 function close(){o.remove()}
 $('#ovs').appendChild(o);o.close=close;
 var f=o.querySelector('input:not([type=checkbox]),select');if(f&&!/Mobi|Android/i.test(navigator.userAgent))f.focus();
 return o}
function ask(msg,okLabel,danger){return new Promise(function(res){var o=modal('<h2>Konfirmasi</h2><p class="muted" style="margin:8px 0 0;white-space:pre-line">'+esc(msg)+'</p><div class="acts"><button class="btn" data-n>Batal</button><button class="btn '+(danger?'d':'p')+'" data-y>'+esc(okLabel||'Lanjut')+'</button></div>');
 o.querySelector('[data-n]').onclick=function(){o.close();res(false)};o.querySelector('[data-y]').onclick=function(){o.close();res(true)}})}
function busy(btn,on,txt){if(!btn)return;if(on){btn._h=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spin"></span> '+(txt||'')}else{btn.disabled=false;btn.innerHTML=btn._h}}
function par(items,fn,lim){lim=lim||4;var out=new Array(items.length),i=0;
 return Promise.all(Array.from({length:Math.min(lim,items.length)},function(){return (function nx(){if(i>=items.length)return Promise.resolve();var k=i++;return fn(items[k],k).then(function(r){out[k]=r},function(e){out[k]={ok:false,error:e.message}}).then(nx)})()})).then(function(){return out})}

/* ---------- theme ---------- */
var THEMES=[['light','Terang'],['dark','Gelap'],['aurora','Aurora'],['glass','Glass'],['aurorag','Aurora Glass']];
function getTheme(){try{return localStorage.getItem('th')||'light'}catch(e){return 'light'}}
function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('th',t)}catch(e){}
 var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='light'?'#4f46e5':(t==='dark'?'#0b1020':(t==='glass'?'#dbe4fb':(t==='aurorag'?'#060914':'#070b1a')));
 var n=$('#nTheme');if(n)n.innerHTML=ic('theme')+'Tema: '+(THEMES.filter(function(x){return x[0]===t})[0]||[0,'?'])[1]}
setTheme(getTheme());
function perfDefault(){try{var m=navigator.deviceMemory,c=navigator.hardwareConcurrency;return (m&&m<=4)||(c&&c<=4)}catch(e){return false}}
function getPerf(){try{var v=localStorage.getItem('perf');if(v==='1')return true;if(v==='0')return false}catch(e){}return perfDefault()}
function setPerf(on,keep){if(on)document.documentElement.setAttribute('data-perf','lite');else document.documentElement.removeAttribute('data-perf');if(!keep){try{localStorage.setItem('perf',on?'1':'0')}catch(e){}}}
setPerf(getPerf(),true);

/* ---------- state ---------- */
var S={servers:[],sel:'all',page:'dash',D:{},sort:{k:'exp',d:1},flt:{q:'',proto:'',st:''},picked:{},lim:60,auto:false,autoT:null};
try{S.sel=localStorage.getItem('sel')||'all'}catch(e){}
var PAGES=[['dash','Dashboard','dash'],['acc','Akun','user'],['onl','Online','wifi'],['srv','Server','srv'],['tool','Alat','tool'],['set','Pengaturan','set']];
var PROTO={vmess:'VMess',vless:'VLess',trojan:'Trojan',ss:'Shadowsocks',sshws:'SSH-WS'};
function srvList(){return S.sel==='all'?S.servers:S.servers.filter(function(s){return s.id===S.sel})}
function srvName(id){var s=S.servers.filter(function(x){return x.id===id})[0];return s?s.name:id}
function dd(id){return S.D[id]||(S.D[id]={})}

/* ---------- auth ---------- */
function showLogin(){$('#app').classList.add('hide');$('#bnav').classList.add('hide');$('#login').classList.remove('hide');stopAuto()}
function showApp(){$('#login').classList.add('hide');$('#app').classList.remove('hide');$('#bnav').classList.remove('hide')}
$('#lf').addEventListener('submit',function(e){e.preventDefault();var b=e.target.querySelector('button'),er=$('#lerr');er.classList.add('hide');busy(b,1,'Masuk');
 jf('/auth/login',{method:'POST',body:{password:$('#pw').value}}).then(function(d){busy(b,0);if(d.ok){$('#pw').value='';boot()}else{er.textContent=d.error||'Gagal';er.classList.remove('hide')}},function(){busy(b,0)})});
$('#nOut').innerHTML=ic('out')+'Keluar';
$('#nOut').onclick=function(){jf('/auth/logout',{method:'POST'}).then(showLogin)};
$('#nTheme').onclick=function(){var i=THEMES.map(function(x){return x[0]}).indexOf(getTheme());setTheme(THEMES[(i+1)%THEMES.length][0])};
$('#bTrial').innerHTML=ic('bolt')+'<span class="tl">Trial</span>';$('#bTrial').onclick=function(){trialDlg()};
$('#bMenu').innerHTML=ic('menu');$('#bRef').innerHTML=ic('ref');
$('#bMenu').onclick=function(){$('#side').classList.toggle('open')};
$('#bRef').onclick=function(){S.D={};go(S.page,true)};
document.addEventListener('click',function(e){if(window.innerWidth<=820&&!e.target.closest('#side')&&!e.target.closest('#bMenu'))$('#side').classList.remove('open')});
function mobile(){var b=$('#bMenu');if(window.innerWidth<=820){b.classList.remove('hide')}else b.classList.add('hide')}
window.addEventListener('resize',mobile);

/* ---------- nav ---------- */
function buildNav(){
 $('#nav').innerHTML=PAGES.map(function(p){return '<button class="nav'+(S.page===p[0]?' on':'')+'" data-p="'+p[0]+'">'+ic(p[2])+p[1]+(p[0]==='onl'?'<span class="cnt hide" id="cntOnl"></span>':'')+'</button>'}).join('');
 var bn=[['dash','Home','dash'],['acc','Akun','user'],['onl','Online','wifi'],['srv','Server','srv'],['menu','Menu','menu']];
 $('#bnav').innerHTML=bn.map(function(p){return '<button data-p="'+p[0]+'" class="'+(S.page===p[0]?'on':'')+'">'+ic(p[2])+p[1]+'</button>'}).join('');
 $('#bnav').classList.toggle('hide',$('#app').classList.contains('hide'))}
document.addEventListener('click',function(e){var b=e.target.closest('[data-p]');if(!b)return;var p=b.getAttribute('data-p');if(p==='menu'){$('#side').classList.add('open');e.stopPropagation();return}
 $('#side').classList.remove('open');go(p)});
function srvSelect(){var h='<option value="all">Semua server</option>'+S.servers.map(function(s){return '<option value="'+esc(s.id)+'">'+esc(s.name)+'</option>'}).join('');
 var el=$('#selSrv');el.innerHTML=h;if(S.sel!=='all'&&!S.servers.some(function(s){return s.id===S.sel}))S.sel='all';el.value=S.sel;el.classList.toggle('hide',S.servers.length<2)}
$('#selSrv').onchange=function(){S.sel=this.value;try{localStorage.setItem('sel',S.sel)}catch(e){};S.picked={};go(S.page)};

function stopAuto(){clearInterval(S.autoT);S.autoT=null}
function go(p,force){S.page=p;stopAuto();buildNav();var t=PAGES.filter(function(x){return x[0]===p})[0];$('#ttl').textContent=t?t[1]:'';
 var vv=$('#view');vv.classList.remove('view-in');void vv.offsetWidth;vv.classList.add('view-in');window.scrollTo(0,0);({dash:rDash,acc:rAcc,onl:rOnl,srv:rSrv,tool:rTool,set:rSet})[p](force)}

/* ---------- data loaders ---------- */
function load(ids,parts,force){
 var jobs=[];ids.forEach(function(id){parts.forEach(function(p){var d=dd(id);if(!force&&d[p]&&Date.now()-(d[p+'T']||0)<45000)return;jobs.push([id,p])})});
 var qs={sum:'action=summary',acc:'action=accounts',onl:'action=online',his:'action=history',act:'action=activity',sec:'action=security'};
 var changed=false;
 return par(jobs,function(j){var t=Date.now();return vps(j[0],qs[j[1]]).then(function(r){var d=dd(j[0]);
  d[j[1]+'E']=bad(r)?errMsg(r):null;if(!bad(r)){var o=d[j[1]];if(!o||(j[1]!=='sum'&&JSON.stringify(o)!==JSON.stringify(r))||(j[1]==='sum'&&JSON.stringify(o.counts)+o.cpu_pct+o.mem_pct!==JSON.stringify(r.counts)+r.cpu_pct+r.mem_pct))changed=true;d[j[1]]=r;d[j[1]+'T']=Date.now();if(j[1]==='sum')d.ms=Date.now()-t}else changed=true;
  return r})},5).then(function(){markUpd();return changed})}
function skeleton(n){var h='';for(var i=0;i<n;i++)h+='<div class="card"><div class="sk" style="width:40%"></div><div class="sk" style="width:70%;margin-top:12px"></div><div class="sk" style="width:55%;margin-top:12px"></div></div>';return h}
function noServer(){return '<div class="card empty"><div style="font-size:15px;font-weight:700;color:var(--ink)">Belum ada server</div><p>Tambahkan VPS pertama kamu untuk mulai mengelola akun.</p><button class="btn p" id="goAdd">'+ic('plus')+' Tambah server</button></div>'}
function afterNoServer(){var b=$('#goAdd');if(b)b.onclick=function(){go('srv');setTimeout(addSrv,50)}}

/* ---------- account helpers ---------- */
function daysLeft(exp){if(!exp)return null;var t=Date.parse(String(exp).trim().replace(' ','T'));if(isNaN(t))return null;
 if(/^\d{4}-\d{2}-\d{2}$/.test(String(exp).trim()))t+=86399000;return Math.ceil((t-Date.now())/86400000)}
function accStat(a){if(a.suspended)return ['Ditangguhkan','bad','susp'];
 var d=daysLeft(a.exp);if(d!==null&&d<0)return ['Expired','bad','exp'];
 if(a.quota_mb>0&&a.used_mb>=a.quota_mb)return ['Kuota habis','bad','quota'];
 if(a.penalty_until)return ['Penalti','warn','pen'];
 if(d!==null&&d<=3)return ['Segera habis','warn','soon'];return ['Aktif','ok','ok']}
function allAcc(){var out=[];srvList().forEach(function(s){((dd(s.id).acc)||[]).forEach(function(a){var c=Object.assign({},a);c.sid=s.id;c.sname=s.name;out.push(c)})});return out}
function key(a){return a.sid+'|'+a.proto+'|'+a.username}

/* ---------- DASHBOARD ---------- */
function rDash(force){
 var v=$('#view');if(!S.servers.length){v.innerHTML=noServer();afterNoServer();return}
 var ids=srvList().map(function(s){return s.id}),had=!force&&ids.every(function(i){return dd(i).sum});
 v.innerHTML='<div class="grid g4" id="kp">'+skeleton(4)+'</div><div class="sec">Server</div><div class="grid g3" id="sc">'+skeleton(S.servers.length>3?3:S.servers.length)+'</div>';
 if(had)drawDash();

  +'<label class="row" style="gap:8px;margin-top:14px;cursor:pointer"><input type="checkbox" id="bkD" style="width:17px;min-height:17px;accent-color:var(--a)" '+(d.daily?'checked':'')+(d.paired?'':' disabled')+'> Kirim backup otomatis tiap hari ke Telegram</label><select id="bkH" style="margin-top:8px" '+(d.paired?'':'disabled')+'>'+hrs+'</select></div>'
  +'<div><div class="sec" style="margin-top:0">Backup sekarang</div><div class="row"><button class="btn p" id="bkS"'+(d.paired?'':' disabled')+'>'+ic('bolt')+' Kirim ke Telegram</button><button class="btn" id="bkDl">'+ic('dl')+' Unduh file</button></div>'
  +'<div class="sec">Restore</div><input type="file" id="bkF" accept=".json,application/json"><input id="bkRp" type="password" placeholder="Kata sandi backup (kosong = pakai yang tersimpan)" style="margin-top:8px" autocomplete="off"><select id="bkM" style="margin-top:8px"><option value="merge">Gabung (tambah &amp; perbarui, aman)</option><option value="replace">Ganti semua server</option></select><button class="btn" id="bkR" style="margin-top:8px">Restore dari file</button>'
  +'<div class="faint" style="font-size:12px;margin-top:8px">Via Telegram: kirim file backup ke bot sebagai dokumen dengan caption <span class="mono">/restore KATASANDI</span>.</div></div></div>';
 $('#bkPs').onclick=function(){var v=$('#bkP').value;if(v.length<6)return toast('Minimal 6 karakter',1);jf('/tg/config',{method:'POST',body:{bpass:v}}).then(function(r){toast(r.ok?'Kata sandi disimpan':(r.error||'Gagal'),!r.ok);if(r.ok)tgLoad()})};
 $('#bkD').onchange=function(){var c=this;jf('/tg/config',{method:'POST',body:{daily:c.checked,hour:+$('#bkH').value}}).then(function(r){toast(r.ok?(c.checked?'Backup harian aktif':'Backup harian mati'):(r.error||'Gagal'),!r.ok);if(!r.ok)c.checked=false})};
 $('#bkH').onchange=function(){jf('/tg/config',{method:'POST',body:{hour:+this.value}}).then(function(r){toast(r.ok?'Jam disimpan':(r.error||'Gagal'),!r.ok)})};
 $('#bkS').onclick=function(){var x=this;busy(x,1,'Mengirim');jf('/backup/send',{method:'POST',body:{}}).then(function(r){busy(x,0);toast(r.ok?'Backup terkirim ke Telegram':(r.error||'Gagal'),!r.ok)})};
 $('#bkDl').onclick=function(){var x=this;busy(x,1);fetch('/backup/download',{headers:{'x-panel':'1'}}).then(function(r){return r.text().then(function(t){busy(x,0);try{var j=JSON.parse(t);if(j.ok===false)return toast(j.error||'Gagal',1)}catch(e){}save('cocote-backup.json',t,'application/json');toast('File backup diunduh')})},function(){busy(x,0);toast('Gagal',1)})};
 $('#bkR').onclick=function(){var f=$('#bkF').files[0];if(!f)return toast('Pilih file backup dulu',1);var mode=$('#bkM').value,x=this;
  ask(mode==='replace'?'GANTI semua server dengan isi backup?\nServer yang tidak ada di backup akan dihapus dari panel.':'Gabungkan isi backup ke daftar server sekarang?','Restore',mode==='replace').then(function(y){if(!y)return;busy(x,1,'Memulihkan');
   var fr=new FileReader();fr.onload=function(){jf('/backup/restore',{method:'POST',body:{file:String(fr.result),pass:$('#bkRp').value,mode:mode}}).then(function(r){busy(x,0);if(!r.ok)return toast(r.error||'Gagal',1);toast('Restore selesai: '+r.added+' ditambah, '+r.updated+' diperbarui, total '+r.total);S.D={};loadServers()},function(e){busy(x,0);toast(e.message,1)})};fr.onerror=function(){busy(x,0);toast('Gagal membaca file',1)};fr.readAsText(f)})}}

/* ---------- notifikasi browser ---------- */
var BN={t:null,seen:{},acc:{},accT:{}};
function bnOn(){try{return localStorage.getItem('bn')==='1'}catch(e){return false}}
function bnInit(){var c=$('#bn'),n=$('#bnN');if(!c)return;
 var sup='Notification' in window;if(!sup){c.disabled=true;n.textContent='Browser ini tidak mendukung notifikasi.';n.classList.remove('hide');return}
 c.checked=bnOn()&&Notification.permission==='granted';
 c.onchange=function(){if(!c.checked){try{localStorage.setItem('bn','0')}catch(e){};bnStop();return}
  Notification.requestPermission().then(function(p){if(p!=='granted'){c.checked=false;n.textContent='Izin notifikasi ditolak. Aktifkan lewat pengaturan situs di browser.';n.classList.remove('hide');return}
   try{localStorage.setItem('bn','1')}catch(e){};n.classList.add('hide');bnStart();bnShow('Notifikasi aktif','Panel akan memberi tahu jika ada akun melebihi limit.')})}}
function bnShow(title,body){var o={body:body,icon:undefined,tag:title};
 if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration){navigator.serviceWorker.getRegistration().then(function(r){if(r&&r.showNotification)r.showNotification(title,o);else{try{new Notification(title,o)}catch(e){}}}).catch(function(){try{new Notification(title,o)}catch(e){}})}
 else{try{new Notification(title,o)}catch(e){}}}
function bnStop(){clearInterval(BN.t);BN.t=null}
function bnStart(){bnStop();if(!bnOn()||!('Notification' in window)||Notification.permission!=='granted')return;
 if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(function(){});
 BN.t=setInterval(bnPoll,120000);setTimeout(bnPoll,4000)}
function bnPoll(){if(document.hidden||document.getElementById('app').classList.contains('hide')||!S.servers.length)return;
 par(S.servers,function(s){return vps(s.id,'action=online').then(function(o){if(bad(o))return o;
  var xr=(o.xray||[]).filter(function(x){return x.source!=='traffic'&&x.devices>=2}),need=xr.length&&(!BN.acc[s.id]||Date.now()-(BN.accT[s.id]||0)>600000);
  return (need?vps(s.id,'action=accounts').then(function(a){if(!bad(a)){var m={};a.forEach(function(x){m[x.username]=x.ip_limit});BN.acc[s.id]=m;BN.accT[s.id]=Date.now()}}):Promise.resolve()).then(function(){
   var lim=BN.acc[s.id]||{};(o.ssh||[]).forEach(function(x){if(x.limit>0&&x.devices>x.limit)bnAlert(s,x.user,x.devices,x.limit)});
   xr.forEach(function(x){var l=lim[x.user]||0;if(l>0&&x.devices>l)bnAlert(s,x.user,x.devices,l)});return o})})},3)}
function bnAlert(s,u,n,l){var k=s.id+':'+u,now=Date.now();if(BN.seen[k]&&now-BN.seen[k]<1800000)return;BN.seen[k]=now;bnShow('Multi-login: '+u,s.name+' · '+n+'/'+l+' perangkat')}
/* ---------- boot ---------- */
function loadServers(){return jf('/servers').then(function(d){S.servers=(d&&d.servers)||[];srvSelect();return S.servers})}

/* ---------- palette & status ---------- */
var UPD=Date.now();
function markUpd(){UPD=Date.now();updTick()}
function updTick(){var e=$('#upd');if(!e)return;var m=Math.floor((Date.now()-UPD)/60000);
 e.querySelector('span').textContent=m<1?'Baru saja':m+' mnt lalu';e.classList.toggle('old',m>=5)}
setInterval(updTick,30000);
function palItems(){
 var it=[];PAGES.forEach(function(p){it.push({g:'Navigasi',t:p[1],i:p[2],h:'Buka',f:function(){go(p[0])}})});
 it.push({g:'Aksi',t:'Buat akun baru',i:'plus',f:function(){go('acc');setTimeout(createAcc,60)}});
 it.push({g:'Aksi',t:'Trial cepat',i:'bolt',f:function(){trialDlg()}});
 it.push({g:'Aksi',t:'Muat ulang data',i:'ref',f:function(){go(S.page,true)}});
 it.push({g:'Aksi',t:'Ganti tema',i:'theme',f:function(){$('#nTheme').click()}});
 return it}
function openPal(){
 if(document.querySelector('.pal'))return;
 var base=palItems(),acc=allAcc(),sel=0,cur=[];
 var o=modal('<div class="pal"><input id="pq" placeholder="Cari akun, halaman, atau aksi…" autocomplete="off" aria-label="Cari"><div class="pl" id="pl"></div><div class="pf"><span><kbd>↑↓</kbd> pilih</span><span><kbd>Enter</kbd> buka</span><span><kbd>Esc</kbd> tutup</span></div></div>');
 var m=o.querySelector('.modal');m.style.padding='0';m.style.maxWidth='none';m.style.width='auto';m.style.alignSelf='flex-start';m.style.marginTop='12vh';
 var q=o.querySelector('#pq'),pl=o.querySelector('#pl');
 function draw(){var t=q.value.trim().toLowerCase();cur=[];
  base.forEach(function(x){if(!t||x.t.toLowerCase().indexOf(t)>-1)cur.push(x)});
  if(t){var n=0;for(var k=0;k<acc.length&&n<8;k++){var a=acc[k];if(a.username.toLowerCase().indexOf(t)>-1){n++;(function(a){cur.push({g:'Akun',t:a.username,i:'user',h:a.sname+' · '+a.proto,f:function(){showLink(a)}})})(a)}}}
  if(sel>=cur.length)sel=Math.max(0,cur.length-1);
  var h='',g='';cur.forEach(function(x,i){if(x.g!==g){g=x.g;h+='<div class="pg">'+g+'</div>'}
   h+='<button class="pr'+(i===sel?' on':'')+'" data-i="'+i+'">'+ic(x.i)+'<span>'+esc(x.t)+'</span><small>'+esc(x.h||'')+'</small></button>'});
  pl.innerHTML=h||'<div class="pe">Tidak ada hasil</div>';
  var on=pl.querySelector('.on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest'})}
 function run(i){var x=cur[i];if(!x)return;close();setTimeout(x.f,30)}
 function close(){var b=o.querySelector('.modal');if(o.parentNode)o.parentNode.removeChild(o)}
 q.oninput=function(){sel=0;draw()};
 q.onkeydown=function(e){if(e.key==='ArrowDown'){sel=Math.min(cur.length-1,sel+1);draw();e.preventDefault()}
  else if(e.key==='ArrowUp'){sel=Math.max(0,sel-1);draw();e.preventDefault()}
  else if(e.key==='Enter'){run(sel);e.preventDefault()}else if(e.key==='Escape')close()};
 pl.onclick=function(e){var b=e.target.closest('.pr');if(b)run(+b.dataset.i)};
 draw();setTimeout(function(){q.focus()},30)}
document.addEventListener('keydown',function(e){
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){if($('#app')&&!$('#app').classList.contains('hide')){e.preventDefault();openPal()}}
 else if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'')&&!document.querySelector('.ov')){e.preventDefault();openPal()}});
function boot(){showApp();mobile();setTheme(getTheme());var bp=$('#bPal');if(bp){bp.querySelector('.pi').innerHTML=ic('search');bp.onclick=openPal}markUpd();bnStart();
 return loadServers().then(function(){buildNav();go(S.page==='dash'?'dash':S.page)}).catch(function(){})}
jf('/auth/me').then(function(d){if(d.ok)boot();else showLogin()},function(){showLogin()});
</script>
