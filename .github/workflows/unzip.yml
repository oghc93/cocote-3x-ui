name: Unzip oghc93-panel.zip

on:
  workflow_dispatch:
  push:
    paths:
      - "oghc93-panel.zip"

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ke root repo
        run: |
          if [ ! -f oghc93-panel.zip ]; then echo "oghc93-panel.zip tidak ada"; exit 0; fi
          mkdir /tmp/ex
          unzip -o oghc93-panel.zip -d /tmp/ex
          # kalau hanya ada 1 folder pembungkus, naikkan isinya
          if [ "$(ls -A /tmp/ex | wc -l)" = "1" ] && [ -d /tmp/ex/"$(ls /tmp/ex)" ]; then
            cp -a /tmp/ex/"$(ls /tmp/ex)"/. .
          else
            cp -a /tmp/ex/. .
          fi
          rm oghc93.zip

      - name: Commit hasil
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Extract oghc93.zip" || echo "Tidak ada perubahan"
          git push
