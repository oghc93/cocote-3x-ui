name: Unzip
on:
  workflow_dispatch:
    inputs:
      zipfile:
        description: "Nama file (kosongkan untuk cari otomatis yang berisi 'hcr')"
        default: "cocote-3x-ui.zip"
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    env:
      PAT: ${{ secrets.PAT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Cari file
        run: |
          F="${{ github.event.inputs.zipfile }}"
          if [ -z "$F" ] || [ ! -f "$F" ]; then
            F=$(find . -type f \( -iname "*hcr*.zip" -o -iname "*hcr*.tar.gz" -o -iname "*hcr*.tgz" \) -not -path "./.git/*" | head -n 1)
          fi
          [ -n "$F" ] || { echo "File hcr tidak ditemukan"; ls -la; exit 1; }
          echo "FILE=$F" >> $GITHUB_ENV
          echo "File terpilih: $F"

      - name: Extract ke root repo
        run: |
          mkdir _tmp
          case "$FILE" in
            *.zip) unzip -o "$FILE" -d _tmp ;;
            *.tar.gz|*.tgz) tar -xzf "$FILE" -C _tmp ;;
          esac
          if [ -z "$PAT" ]; then
            rm -rf _tmp/.github
          fi
          if [ "$(ls -A _tmp | wc -l)" -eq 1 ] && [ -d "_tmp/$(ls -A _tmp)" ]; then
            cp -a _tmp/*/. .
          else
            cp -a _tmp/. .
          fi
          rm -rf _tmp
          rm -f "$FILE"

      - name: Commit dan push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unzip $FILE" || echo "tidak ada perubahan"
          git push
